<!doctype html>
<meta charset="utf-8">
<title>mimesis</title>
<style>
/* Source Serif 4 is inlined by tools/make_standalone.py so the reveal renders
   the intended face with no network. The stack below still prefers a licensed
   Tiempos Text if one is installed on the machine. */
@font-face{font-family:"MimesisSerif";font-weight:300;font-display:block;
  src:url(FONT_LIGHT) format("truetype")}
@font-face{font-family:"MimesisSerif";font-weight:400;font-display:block;
  src:url(FONT_REGULAR) format("truetype")}
:root{
  --obs:#efece4;          /* DETECT, RESOLVE — observation */
  --measure:#6ef2a8;      /* MEASURE — quantity taken */
  --relate:#bdeede;       /* RELATE — comparison */
  --doubt:#ff4a4a;        /* DOUBT — the floor, the rejects */
  --paper:#efece4;
  --stroke:0.9px;
  --num:11px;
  --serif:34px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;cursor:none;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body.config{cursor:default}
#stage{position:fixed;inset:0}
.zone{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.zone svg{display:block;overflow:visible}
.zone .text{position:absolute;inset:0}

/* structure is white throughout, as in the reference: boxes, connectors and
   leader lines read as one instrument. Colour is carried by the labels alone,
   so the pass is legible without the drawing changing hue. */
svg .s{fill:none;stroke:var(--obs);stroke-width:var(--stroke);
  vector-effect:non-scaling-stroke;stroke-linecap:butt;opacity:.88}
svg .s.alarm{stroke:var(--doubt)}
svg text{fill:currentColor;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:var(--num);letter-spacing:.04em;dominant-baseline:hanging}
svg .obs{color:var(--obs)} svg .measure{color:var(--measure)}
svg .relate{color:var(--relate)} svg .doubt{color:var(--doubt)}
svg text.alarm,svg .tab.alarm{color:var(--doubt)}
svg text{fill:currentColor}
svg image{opacity:.5}
/* field layers: the painting's own topography, drawn once and then only
   faded. dense by nature -- this is where the overwhelm lives, and none of it
   is generative: every curve is an iso-luminance contour of the paint, every
   vector a measured gradient, every triangle an edge of the face mesh. */
svg .fld{fill:none;vector-effect:non-scaling-stroke;stroke-width:0.7px}
svg .iso{stroke:var(--obs)}
svg .flow{stroke:var(--measure)}
svg .outline{stroke:var(--relate)}
svg .wire{stroke:var(--obs);stroke-width:0.5px}
/* square layers. every rectangle here was produced by the pipeline: the
   windows the detector actually scanned, the bounding box of every measured
   blob, and the box of every named facial feature. */
svg .tiles{stroke:var(--obs);stroke-width:0.6px}
svg .blobbox{stroke:var(--relate);stroke-width:0.6px}
svg .featbox{stroke:var(--measure);stroke-width:0.7px}
/* a label tab: small dark plate behind the word, as on a detector readout.
   the only filled element in the overlay, kept dark so it cannot bloom. */
/* the plate behind a label carries no border: the only rectangles with an
   outline are the ones that mean something. */
svg rect.tab{fill:#080808F2;stroke:none}
svg text.tab{font-size:10px;letter-spacing:.05em;dominant-baseline:hanging}
svg text.trace{font-size:9px;letter-spacing:.02em;opacity:.30}
svg text.status{font-size:10px;letter-spacing:.08em;opacity:.75}

.answer{font-family:"MimesisSerif","Tiempos Text",Georgia,serif;
  font-size:var(--serif);line-height:1.65;color:var(--paper);
  letter-spacing:-.008em;font-weight:300}
/* the answer is a continuous column that scrolls, not a reveal.
   the mask lets lines enter and leave without a hard edge; it is a legibility
   device, not motion -- the scroll itself is linear and clock-driven. */
.viewport{position:absolute;left:0;right:0;top:2.6em;bottom:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
.column{position:absolute;left:0;right:0;top:0;will-change:transform}
.column p{margin:0 0 .72em}
.caret{position:absolute;width:1px;background:var(--paper);display:none}
.column p.supplied{opacity:.72}
.column p.unsupported{opacity:.72}
.column p.unsupported::after{content:" \2014 UNSUPPORTED";font-family:ui-monospace,monospace;
  font-size:11px;letter-spacing:.08em;color:var(--doubt);vertical-align:.35em}
.column .sec{font-family:ui-monospace,Menlo,monospace;font-size:11px;
  letter-spacing:.1em;color:var(--measure);opacity:.5;margin:1.6em 0 .6em}
.banner{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.6;
  color:var(--measure);opacity:.5;margin-bottom:1.2em;letter-spacing:.06em}

.handle{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;
  border:1px solid var(--measure);border-radius:50%;display:none;z-index:50}
.handle::after{content:"";position:absolute;inset:9px;background:var(--measure)}
body.config .handle{display:block;cursor:grab}
body.config .zone{outline:1px dashed #2a4d3d}
#hud{position:fixed;left:12px;top:12px;z-index:60;color:var(--measure);
  font-size:11px;line-height:1.7;display:none;white-space:pre;
  background:#000c;padding:10px 12px;border:1px solid #2a4d3d}
body.config #hud{display:block}
#status{position:fixed;right:12px;bottom:12px;z-index:60;color:#3a5a4d;
  font-size:10px;text-align:right;white-space:pre;letter-spacing:.06em}
</style>

<div id="stage"></div><div id="hud"></div><div id="status"></div>

<script>
"use strict";
/* =====================================================================
   mimesis — presentation layer.

   One clock. Every visual state is a PURE FUNCTION of it: the renderer asks
   what should be visible at t, and how far through its own growth each mark
   is, without ever accumulating. A seek lands exactly; a fifteen-minute loop
   cannot drift.

   The unit of composition is a box, a circle beside it, and a connector
   carrying the number and the sentence that justifies it. Colour is time:
   white while observing, green while measuring and relating, red for doubt.
   ===================================================================== */

const FILES=["panel_a_detection","panel_b_detection","panel_a_flames","panel_b_flames",
  "panel_a_field","panel_b_field","panel_a_overlay_plan","panel_b_overlay_plan",
  "face_analysis","structure","stability","noise_floor","score_a","score_b","claims","face_features","panel_a_fields","panel_b_fields"];
const D=(window.MIMESIS_DATA)||{};
const IMG=(window.MIMESIS_IMAGES)||{};

function ptr(o,p){ if(p==null||p==="")return o; let c=o;
  for(const k of p.replace(/^\//,"").split("/")){ if(c==null)return undefined;
    c=c[k.replace(/~1/g,"/").replace(/~0/g,"~")]; } return c; }
function sourceDoc(panel,file){ const l=panel.toLowerCase();
  return {detection:D["panel_"+l+"_detection"],flames:D["panel_"+l+"_flames"],
    field:D["panel_"+l+"_field"],overlay_plan:D["panel_"+l+"_overlay_plan"],
    fields:D["panel_"+l+"_fields"],
    face_analysis:D.face_analysis,structure:D.structure,stability:D.stability,
    noise_floor:D.noise_floor,claims:D.claims,
    face_features:D.face_features}[file]; }

/* ---------- homography -> matrix3d ---------- */
function homography(w,h,c){
  const src=[[0,0],[w,0],[w,h],[0,h]],A=[],b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i],[u,v]=c[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  const M=A.map((r,i)=>r.concat([b[i]]));
  for(let i=0;i<8;i++){ let p=i;
    for(let r=i+1;r<8;r++) if(Math.abs(M[r][i])>Math.abs(M[p][i])) p=r;
    [M[i],M[p]]=[M[p],M[i]];
    if(Math.abs(M[i][i])<1e-12) return null;
    for(let r=0;r<8;r++){ if(r===i) continue; const f=M[r][i]/M[i][i];
      for(let k=i;k<9;k++) M[r][k]-=f*M[i][k]; } }
  const H=[]; for(let i=0;i<8;i++) H.push(M[i][8]/M[i][i]);
  return `matrix3d(${H[0]},${H[3]},0,${H[6]},${H[1]},${H[4]},0,${H[7]},0,0,1,0,${H[2]},${H[5]},0,1)`;
}

/* ---------- zones ---------- */
// Overlay nominal size is the painting's own aspect, so a normalised box is
// square on screen when it is square on the canvas. 40 x 30 cm -> 4:3.
const NOMINAL={overlay:[1000,750],text:[1121,1400]};
function nominalFor(z){
  if(z.kind!=="overlay") return NOMINAL.text;
  const d=D["panel_"+z.panel.toLowerCase()+"_detection"];
  const cm=d&&d.canvas_cm;
  if(cm&&cm[0]&&cm[1]) return [1000, Math.round(1000*cm[1]/cm[0])];
  return NOMINAL.overlay;
}
const ZONES=[{id:"A-overlay",kind:"overlay",panel:"A"},{id:"A-text",kind:"text",panel:"A"},
  {id:"B-overlay",kind:"overlay",panel:"B"},{id:"B-text",kind:"text",panel:"B"}];
const LS_KEY="mimesis.zones.v2";
function defaultCorners(z){
  // Physically accurate layout: 4K across 3.5 m, two 40 cm paintings at 22% of
  // the raster, text columns at a 65-character measure, the rest black.
  //
  // The layout is defined in the TARGET raster (3840 x 2160) and then letter-
  // boxed into whatever window this is actually running in. Deriving it from
  // innerWidth/innerHeight directly was the alignment bug: on any window that
  // is not 16:9 the overlay zone stopped being 4:3, and the painting -- and
  // every box drawn on it -- was stretched to fit.
  const TW=3840, TH=2160;
  const s=Math.min(innerWidth/TW, innerHeight/TH);
  const ox=(innerWidth-TW*s)/2, oy=(innerHeight-TH*s)/2;
  const X={"A-text":[0.0938,0.3857],"A-overlay":[0.3857,0.5000],
           "B-overlay":[0.5000,0.6143],"B-text":[0.6143,0.9063]}[z.id];
  const x0=ox+X[0]*TW*s, x1=ox+X[1]*TW*s;
  let y0,y1;
  if(z.kind==="overlay"){
    // height follows from width and the canvas ratio, so the default is exactly
    // the painting's aspect rather than a rounded fraction of the raster
    const [nw,nh]=nominalFor(z);
    const hgt=(x1-x0)*nh/nw;
    const cy=oy+0.4998*TH*s;
    y0=cy-hgt/2; y1=cy+hgt/2;
  } else {
    y0=oy+0.1759*TH*s; y1=oy+0.8241*TH*s;
  }
  return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
}
function loadZones(){ let s=null; try{s=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
  ZONES.forEach(z=>{ const [w,h]=nominalFor(z); z.w=w; z.h=h;
    z.corners=(s&&s[z.id])||defaultCorners(z); }); }
function saveZones(){ const o={}; ZONES.forEach(z=>o[z.id]=z.corners);
  localStorage.setItem(LS_KEY,JSON.stringify(o)); }
function applyZone(z){ z.el.style.width=z.w+"px"; z.el.style.height=z.h+"px";
  const m=homography(z.w,z.h,z.corners); if(m) z.el.style.transform=m;
  z.handles.forEach((hd,i)=>{hd.style.left=z.corners[i][0]+"px";hd.style.top=z.corners[i][1]+"px";}); }
function buildZones(){
  const stage=document.getElementById("stage");
  ZONES.forEach(z=>{
    const el=document.createElement("div"); el.className="zone"; el.id=z.id;
    if(z.kind==="overlay"){
      const im=IMG["panel_"+z.panel.toLowerCase()];
      el.innerHTML=`<svg width="${z.w}" height="${z.h}" viewBox="0 0 ${z.w} ${z.h}">`+
        (im?`<image class="backdrop" href="${im}" x="0" y="0" width="${z.w}" height="${z.h}"/>`:``)+
        `<g class="fields"></g><g class="ink"></g></svg>`;
      z.svg=el.querySelector("svg");
      z.fields=el.querySelector(".fields"); z.ink=el.querySelector(".ink");
      z.backdrop=el.querySelector(".backdrop");
    } else {
      el.innerHTML=`<div class="text"><div class="answer"></div></div>`;
      z.answerEl=el.querySelector(".answer");
    }
    stage.appendChild(el); z.el=el;
    z.handles=[0,1,2,3].map(i=>{ const hd=document.createElement("div");
      hd.className="handle"; document.body.appendChild(hd); let drag=false;
      hd.addEventListener("pointerdown",e=>{drag=true;hd.setPointerCapture(e.pointerId);});
      hd.addEventListener("pointermove",e=>{ if(drag){z.corners[i]=[e.clientX,e.clientY];applyZone(z);} });
      hd.addEventListener("pointerup",()=>{drag=false;saveZones();});
      return hd; });
    applyZone(z);
  });
}

/* ---------- clock ---------- */
/* ---------- the clock ----------
   With narration loaded every track reads audio.currentTime, so the overlay,
   the typed answer and the reasoning trace are all locked to the voice and
   cannot drift from it or from each other. With no audio the identical lookup
   runs against a monotonic wall clock and no cue timing changes.

   Browsers refuse to start audio without a gesture, so the show waits on one
   keypress. In the gallery that is the same keypress that starts the piece. */
let AUD={}, audioStarted=false, showBackdrop=true, showGrid=false, showFields=true;

/* Each panel is driven by ITS OWN narration. The two recordings are different
   lengths -- 363s and 376s -- and a panel's words have to match the voice
   describing that panel, so these are two channels on two clocks rather than
   one clock shared. Within a panel nothing can drift: overlay cycle, typed
   answer and reasoning trace all read the same audio.currentTime. Between
   panels they are deliberately independent, which is what a two-channel
   installation is. */
function clockSeconds(panel){
  const a=AUD[panel];
  if(a && a.ready && !a.el.paused) return a.el.currentTime;
  return performance.now()/1000;
}
function setupAudio(){
  for(const P of ["A","B"]){
    const sc=D["score_"+P.toLowerCase()]; if(!sc) continue;
    const src=(window.MIMESIS_AUDIO&&window.MIMESIS_AUDIO[P])||((sc.clock||{}).audio_file);
    if(!src) continue;
    const el=new Audio(src);
    el.loop=true; el.preload="auto";
    el.addEventListener("loadedmetadata",()=>{
      if(isFinite(el.duration)&&el.duration>1) sc.loop_duration_s=el.duration;
    });
    AUD[P]={el,ready:false};
  }
  if(!Object.keys(AUD).length) return;
  // browsers refuse to start audio without a gesture; both voices start together
  const start=()=>{
    for(const P in AUD){
      AUD[P].el.play().then(()=>{AUD[P].ready=true;audioStarted=true;}).catch(()=>{});
    }
    removeEventListener("keydown",start); removeEventListener("pointerdown",start);
  };
  addEventListener("keydown",start); addEventListener("pointerdown",start);
}
function audioState(){
  const n=Object.keys(AUD).length;
  if(!n) return "no voice";
  return audioStarted ? `VOICE ${n}ch` : "press any key to start the voice";
}

function loopT(s){ const L=s.loop_duration_s||900;
  return ((clockSeconds(s.panel)%L)+L)%L; }
/* the overlay runs its own fast cycle, repeating many times inside the master
   loop. same clock, shorter modulus -- so it reads as a live instrument rather
   than something paced to a fifteen-minute score. */
function cycleT(s){ const C=s.overlay_cycle_s||s.loop_duration_s||900;
  return ((clockSeconds(s.panel)%C)+C)%C; }
/* growth: linear, hard-edged. no easing anywhere in this file. */
function grow(t,t_in,secs){ if(!secs) return 1; return Math.max(0,Math.min(1,(t-t_in)/secs)); }
function lit(t,hz){ return hz? (Math.floor(t*hz*2)%2)===0 : true; }

/* ---------- svg ---------- */
const NS="http://www.w3.org/2000/svg";
function mk(tag,a,txt){ const e=document.createElementNS(NS,tag);
  for(const k in a) if(a[k]!=null) e.setAttribute(k,a[k]);
  if(txt!=null) e.textContent=txt; return e; }
/* a label types in, hard, one character at a time — no blur out here.
   the blur reveal belongs to the answer, this layer is telemetry. */
function typed(text,t,t0,cps){ if(!text) return "";
  const n=Math.floor(Math.max(0,(t-t0))*cps);
  return text.slice(0,Math.min(text.length,n)); }

/* ---------- field layers ----------
   Built once as SVG paths. Per frame only group opacity changes, so drawing
   fifty thousand contour points costs the same as drawing none. */
function buildFields(z){
  const F=D["panel_"+z.panel.toLowerCase()+"_fields"];
  z.fieldsBuilt=true;
  if(!F||!z.fields) return;
  const W=z.w,H=z.h,g=z.fields;
  const P=(pts)=>pts.map((p,i)=>(i?"L":"M")+(p[0]*W).toFixed(1)+" "+(p[1]*H).toFixed(1)).join("");

  z.isoGroups=[];
  F.iso_contours.forEach(lv=>{
    const el=mk("path",{class:"fld iso",d:lv.polylines.map(P).join(""),opacity:0});
    g.appendChild(el); z.isoGroups.push({el,frac:lv.level_frac});
  });

  const fl=F.flow, [GW,GH]=fl.grid;
  let d="";
  fl.cells.forEach(c=>{
    const x=(c.c[0]+0.5)/GW*W, y=(c.c[1]+0.5)/GH*H;
    const L=Math.min(W/GW,H/GH)*0.9*c.m;
    d+=`M${(x-c.d[0]*L/2).toFixed(1)} ${(y-c.d[1]*L/2).toFixed(1)}`+
       `L${(x+c.d[0]*L/2).toFixed(1)} ${(y+c.d[1]*L/2).toFixed(1)}`;
  });
  z.flowEl=mk("path",{class:"fld flow",d,opacity:0}); g.appendChild(z.flowEl);

  z.outlineEl=mk("path",{class:"fld outline",
    d:F.blob_outlines.map(o=>P(o.poly)+"Z").join(""),opacity:0});
  g.appendChild(z.outlineEl);

  const R=(x,y,w,h)=>`M${(x*W).toFixed(1)} ${(y*H).toFixed(1)}h${(w*W).toFixed(1)}`+
    `v${(h*H).toFixed(1)}h${(-w*W).toFixed(1)}Z`;

  // the windows the detector actually scanned, nested at four scales
  const det0=sourceDoc(z.panel,"detection");
  const tiles=new Set();
  for(const f of det0.faces){
    const hint=(f.detectors.blazeface||{}).scale_hint||"";
    const m=/^tile([\d.]+)@(\d+),(\d+)$/.exec(hint);
    if(m) tiles.add(m[1]+","+m[2]+","+m[3]);
  }
  const PW=det0.painting_rect_px[0], PH=det0.painting_rect_px[1];
  let td="";
  tiles.forEach(k=>{ const [fr,tx,ty]=k.split(",").map(Number);
    const side=Math.max(PW,PH)*fr;
    td+=R(tx/PW, ty/PH, Math.min(side,PW-tx)/PW, Math.min(side,PH-ty)/PH); });
  z.tileEl=mk("path",{class:"fld tiles",d:td,opacity:0}); g.appendChild(z.tileEl);

  // the bounding box of every measured blob
  const fld2=sourceDoc(z.panel,"field");
  z.blobEl=mk("path",{class:"fld blobbox",
    d:(fld2?fld2.blobs:[]).map(b=>R(b.box[0],b.box[1],b.box[2],b.box[3])).join(""),
    opacity:0});
  g.appendChild(z.blobEl);

  // every named feature of every face: eye, eye, brow, brow, nose, lips, oval, irises
  z.featEls={};
  const FF=D.face_features;
  if(FF&&FF.panels[z.panel]){
    for(const r of FF.panels[z.panel]){
      let fd="";
      for(const k in r.features){ const b=r.features[k].box;
        fd+=R(b[0],b[1],b[2],b[3]); }
      const el=mk("path",{class:"fld featbox",d:fd,opacity:0});
      g.appendChild(el); z.featEls[r.face_id]=el;
    }
  }

  // full mesh wireframe per face, from the shared triangulation
  z.wires={};
  const det=sourceDoc(z.panel,"detection"), topo=F.mesh_topology;
  if(topo){
    for(const f of det.faces){
      if(!f.landmarks||f.landmarks.length<468) continue;
      let wd="";
      for(const [a,b] of topo.edges){
        const p=f.landmarks[a], q=f.landmarks[b];
        if(!p||!q) continue;
        wd+=`M${(p[0]*W).toFixed(1)} ${(p[1]*H).toFixed(1)}`+
            `L${(q[0]*W).toFixed(1)} ${(q[1]*H).toFixed(1)}`;
      }
      const el=mk("path",{class:"fld wire",d:wd,opacity:0});
      g.appendChild(el); z.wires[f.face_id]=el;
    }
  }
}

function drawFields(z,t,score){
  if(!z.fieldsBuilt) buildFields(z);
  if(!z.isoGroups) return 0;
  const C=score.overlay_cycle_s||score.loop_duration_s||900, ph=t/C;
  const off=e=>e&&e.setAttribute("opacity",0);
  if(!showFields){
    z.isoGroups.forEach(o=>off(o.el));
    off(z.flowEl); off(z.outlineEl); off(z.tileEl); off(z.blobEl);
    for(const k in z.wires) off(z.wires[k]);
    for(const k in z.featEls) off(z.featEls[k]);
    return 0;
  }
  // a band of luminance levels sweeps the range twice per loop: the painting's
  // topography read from shadow up to flame and back
  const sweep=(Math.sin(ph*Math.PI*6)*0.5+0.5);
  let n=0;
  z.isoGroups.forEach(o=>{
    const d=Math.abs(o.frac-sweep);
    const a=Math.max(0,0.62-d*1.5);
    o.el.setAttribute("opacity",a.toFixed(3)); if(a>0.01) n++;
  });
  if(z.flowEl) z.flowEl.setAttribute("opacity",(0.12+0.28*Math.abs(Math.sin(ph*Math.PI*4))).toFixed(3));
  if(z.outlineEl) z.outlineEl.setAttribute("opacity",0.24);
  // square layers: scan windows pulse with the pass, blob boxes hold steady
  if(z.tileEl) z.tileEl.setAttribute("opacity",
    (0.10+0.22*Math.abs(Math.sin(ph*Math.PI*10))).toFixed(3));
  if(z.blobEl) z.blobEl.setAttribute("opacity",0.16);
  // a face wears its wireframe and its feature boxes while it holds attention
  const live=new Set();
  for(const c of score.tracks.overlay){
    if(t>=c.t_in&&t<c.t_out&&c.face_ids) c.face_ids.forEach(f=>live.add(f));
  }
  for(const k in z.wires) z.wires[k].setAttribute("opacity",live.has(k)?0.42:0.09);
  for(const k in z.featEls) z.featEls[k].setAttribute("opacity",live.has(k)?0.65:0.18);
  return n+4;
}

function drawOverlay(z){
  const score=D["score_"+z.panel.toLowerCase()]; if(!score) return 0;
  const t=cycleT(score),W=z.w,H=z.h,P=z.panel;
  const det=sourceDoc(P,"detection");
  const face=id=>det.faces.find(f=>f.face_id===id);
  drawFields(z,t,score);
  const g=document.createDocumentFragment(); let n=0;
  if(z.backdrop) z.backdrop.style.display=showBackdrop?"":"none";
  if(showGrid){
    const gg=document.createDocumentFragment();
    gg.appendChild(mk("rect",{class:"s obs",x:0.5,y:0.5,width:W-1,height:H-1}));
    [[0,0],[W,0],[W,H],[0,H]].forEach(([px,py])=>{
      gg.appendChild(mk("path",{class:"s obs",
        d:`M${px-26} ${py}h52M${px} ${py-26}v52`}));
    });
    gg.appendChild(mk("path",{class:"s obs",
      d:`M${W/2-30} ${H/2}h60M${W/2} ${H/2-30}v60`}));
    for(let i=1;i<10;i++){
      gg.appendChild(mk("line",{class:"s obs",opacity:.25,x1:W*i/10,y1:0,x2:W*i/10,y2:H}));
      gg.appendChild(mk("line",{class:"s obs",opacity:.25,x1:0,y1:H*i/10,x2:W,y2:H*i/10}));
    }
    gg.appendChild(mk("text",{class:"obs",x:6,y:6},
      `PANEL ${z.panel}  ${W}x${H}  aspect ${(W/H).toFixed(4)}`));
    z.ink.replaceChildren(gg);
    return 1;
  }

  for(const c of score.tracks.overlay){
    if(t<c.t_in||t>=c.t_out) continue;
    if(c.flash_from){
      const rec=ptr(sourceDoc(P,c.flash_from.file),c.flash_from.pointer);
      if(!lit(t,rec?rec[c.flash_from.field]:0)) continue;
    }
    const rec=ptr(sourceDoc(P,c.source.file),c.source.pointer);
    if(rec===undefined) continue;
    n+=drawCue(g,c,rec,face,W,H,t,score);
  }
  // the reasoning trace, small and fast, on and around the paint
  const rz=score.tracks.reasoning||[];
  if(rz.length){
    const live=rz.filter(r=>t>=r.t_in&&t<r.t_out).slice(-4);
    live.forEach((r,i)=>{
      const chars=Math.floor(Math.max(0,(t-r.t_in))*1000/(r.line_interval_ms||34));
      const txt=r.text.slice(0,Math.min(r.text.length,chars)).slice(0,86);
      if(txt) g.appendChild(mk("text",{class:"trace measure",x:6,y:14+i*11},txt));
    });
  }
  z.ink.replaceChildren(g);
  return n;
}

/* A label plate whose named CORNER sits exactly on (x,y), so a leader line
   ending at that point meets the corner rather than crossing the plate.
   corner is one of "tl","tr","bl","br" -- the corner that is pinned. */
function tab(g,x,y,txt,cls,corner,W,H){
  const w=txt.length*6.0+7, h=12.5;
  let x0 = (corner==="tr"||corner==="br") ? x-w : x;
  let y0 = (corner==="bl"||corner==="br") ? y-h : y;
  if(W){ x0=Math.max(1,Math.min(x0,W-w-1)); }
  if(H){ y0=Math.max(1,Math.min(y0,H-h-1)); }
  g.appendChild(mk("rect",{class:"tab "+cls,x:x0,y:y0,width:w,height:h}));
  g.appendChild(mk("text",{class:"tab "+cls,x:x0+3.5,y:y0+2.5},txt));
  return {x:x0,y:y0,w,h};
}
/* which corner of the plate should be pinned, given the direction the leader
   line arrives from */
function cornerFor(dx,dy){ return (dy>=0?"t":"b")+(dx>=0?"l":"r"); }

function drawCue(g,c,rec,face,W,H,t,score){
  const cls=(c.alarm?"alarm":c.role||"obs");
  const push=e=>g.appendChild(e);
  const F=id=>{const f=face(id); return f&&f.box;};
  const b=c.face_ids&&F(c.face_ids[0]);
  const cx=b?(b[0]+b[2]/2)*W:0, cy=b?(b[1]+b[3]/2)*H:0;
  const node=c.at?[c.at[0]*W,c.at[1]*H]:null;
  const k=grow(t,c.t_in,c.grow_s);

  switch(c.cue){

  case "box_emerge": {
    if(!b) break;
    const x0=b[0]*W,y0=b[1]*H,x1=(b[0]+b[2])*W,y1=(b[1]+b[3])*H;
    const arm=Math.max(4,(x1-x0)*0.30)*k;
    [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([ax,ay,dx,dy])=>
      push(mk("path",{class:"s "+cls,d:`M${ax+dx*arm} ${ay}H${ax}V${ay+dy*arm}`})));
    if(k>=1) push(mk("rect",{class:"s "+cls,x:x0,y:y0,width:x1-x0,height:y1-y0}));
    return 1;
  }
  case "box_subdivide": {
    if(!b) break;
    const x0=b[0]*W,y0=b[1]*H,w=b[2]*W,h=b[3]*H,m=c.cells||3;
    for(let i=1;i<m;i++){
      const f=Math.min(1,k*m-i+1); if(f<=0) continue;
      push(mk("line",{class:"s "+cls,x1:x0+w*i/m,y1:y0,x2:x0+w*i/m,y2:y0+h*f}));
      push(mk("line",{class:"s "+cls,x1:x0,y1:y0+h*i/m,x2:x0+w*f,y2:y0+h*i/m}));
    }
    return 1;
  }
  case "box_fail": {
    if(!b) break;
    const x0=b[0]*W,y0=b[1]*H,x1=(b[0]+b[2])*W,y1=(b[1]+b[3])*H;
    push(mk("path",{class:"s alarm",
      d:`M${x0} ${y0}L${x0+(x1-x0)*k} ${y0+(y1-y0)*k}M${x1} ${y0}L${x1-(x1-x0)*k} ${y0+(y1-y0)*k}`}));
    return 1;
  }
  case "connector": {
    if(!b||!node) break;
    // leaves the box at its nearest edge, arrives at the circle's rim
    // a leader line: leaves the box at its outline, lands where the word will sit
    const dx=node[0]-cx, dy=node[1]-cy, L=Math.hypot(dx,dy)||1;
    const ux=dx/L, uy=dy/L;
    const hw=b[2]*W/2, hh=b[3]*H/2;
    const tx=Math.abs(ux)>1e-6?hw/Math.abs(ux):Infinity;
    const ty=Math.abs(uy)>1e-6?hh/Math.abs(uy):Infinity;
    const sx=cx+ux*Math.min(tx,ty), sy=cy+uy*Math.min(tx,ty);
    const ex=node[0], ey=node[1];
    push(mk("line",{class:"s "+cls,x1:sx,y1:sy,x2:sx+(ex-sx)*k,y2:sy+(ey-sy)*k}));
    return 1;
  }
  case "connector_label": {
    // the number and the sentence ride the connector. nothing floats free.
    if(!node) break;
    // the plate's corner lands on the end of the leader line
    const dirx=node[0]-cx, diry=node[1]-cy;
    const corner=cornerFor(dirx,diry);
    const y=node[1] + (corner[0]==="t" ? (c.row||0)*13 : -(c.row||0)*13);
    const l1=typed(c.label||"",t,c.t_in,110);
    if(l1) tab(g,node[0],y,l1,cls,corner,W,H);
    if(c.label2&&l1.length>=(c.label||"").length){
      const l2=typed(c.label2,t,c.t_in+(c.label||"").length/110,110);
      if(l2) tab(g,node[0],y+(corner[0]==="t"?13:-13),l2,cls,corner,W,H);
    }
    return 1;
  }
  case "feature_box": {
    // a box on the eye, the nose, the mouth — the face taken apart
    const bx=rec.box; if(!bx) break;
    const x0=bx[0]*W, y0=bx[1]*H, w=bx[2]*W, h=bx[3]*H;
    const pad=2.5;
    push(mk("rect",{class:"s "+cls,x:x0-pad,y:y0-pad,
      width:(w+pad*2)*k,height:(h+pad*2)*k,opacity:.9}));
    if(k>=1&&c.label) tab(g,x0-pad,y0-pad-13,c.label,cls,"tl",W,H);
    return 1;
  }
  case "box_content": {
    if(!b) break;
    const x0=b[0]*W,y0=b[1]*H,w=b[2]*W,h=b[3]*H;
    if(c.mode==="confidence"){
      // a bar along the box's inner top edge, length = the score that admitted it
      push(mk("line",{class:"s "+cls,x1:x0+1.5,y1:y0+3,
        x2:x0+1.5+(w-3)*c.value*k,y2:y0+3,opacity:.85}));
    } else if(c.mode==="subdivide"){
      const m=c.cells||3;
      for(let i=1;i<m;i++){
        const f=Math.min(1,k*m-i+1); if(f<=0) continue;
        push(mk("line",{class:"s "+cls,x1:x0+w*i/m,y1:y0,x2:x0+w*i/m,y2:y0+h*f}));
        push(mk("line",{class:"s "+cls,x1:x0,y1:y0+h*i/m,x2:x0+w*f,y2:y0+h*i/m}));
      }
    } else if(c.mode==="fail"){
      push(mk("path",{class:"s alarm",
        d:`M${x0} ${y0}L${x0+w*k} ${y0+h*k}M${x0+w} ${y0}L${x0+w-w*k} ${y0+h*k}`}));
    } else if(c.mode==="bars"){
      // the box fills with what was measured of the face inside it
      const bars=c.bars||[], bh=Math.max(2,(h-6)/Math.max(1,bars.length));
      bars.forEach((bar,i)=>{
        const f=Math.min(1,Math.max(0,k*bars.length-i));
        const y=y0+3+i*bh;
        push(mk("line",{class:"s "+cls,x1:x0+2,y1:y,x2:x0+2+(w-4)*(bar[1]/100)*f,y2:y}));
      });
    }
    return 1;
  }
  case "mesh_full": case "mesh_contour": case "mesh_points": {
    if(!Array.isArray(rec)) break;
    const step=c.cue==="mesh_full"?1:(c.cue==="mesh_contour"?4:60);
    const lim=Math.floor(rec.length*Math.min(1,(t-c.t_in)/0.30));
    let d="";
    for(let i=0;i<lim;i+=step) d+=`M${rec[i][0]*W} ${rec[i][1]*H}h.7`;
    push(mk("path",{class:"s "+cls,d,opacity:.85}));
    return 1;
  }
  case "relation": {
    const a=F(c.face_ids[0]), bb=F(c.face_ids[1]);
    if(!a) break;
    const nodes=score.nodes||{};
    const p1=nodes[c.face_ids[0]]?[nodes[c.face_ids[0]][0]*W,nodes[c.face_ids[0]][1]*H]
                                 :[(a[0]+a[2]/2)*W,(a[1]+a[3]/2)*H];
    let p2;
    if(bb) p2=nodes[c.face_ids[1]]?[nodes[c.face_ids[1]][0]*W,nodes[c.face_ids[1]][1]*H]
                                  :[(bb[0]+bb[2]/2)*W,(bb[1]+bb[3]/2)*H];
    else p2=[c.cross? (c.face_ids[1][0]==="A"?-0.12*W:1.12*W) : p1[0], p1[1]-0.10*H];
    const e=mk("line",{class:"s "+cls,x1:p1[0],y1:p1[1],
      x2:p1[0]+(p2[0]-p1[0])*k,y2:p1[1]+(p2[1]-p1[1])*k});
    if(c.style==="dashed") e.setAttribute("stroke-dasharray","7 6");
    push(e);
    if(k>=1){
      const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
      const l1=typed(c.label||"",t,c.t_in+(c.grow_s||0),40);
      push(mk("text",{class:cls,x:mx+5,y:my-15},l1));
      if(c.label2&&l1.length>=(c.label||"").length){
        const w=Math.min(1,(t-c.t_in-(c.grow_s||0)-(c.label||"").length/40));
        const l2=typed(c.label2,t,c.t_in+(c.grow_s||0)+(c.label||"").length/110,110);
        // second line wraps at ~46 chars so it stays on the connector
        l2.match(/.{1,46}(\s|$)/g)?.forEach((seg,i)=>
          push(mk("text",{class:cls,x:mx+5,y:my-2+i*13,opacity:.62},seg.trim())));
      }
    }
    return 1;
  }
  case "claim_word": {
    // one word, verbatim from a model claim, tabbed and tied to what it names
    const w=(c.label||"").length*6+7;
    let ax,ay;
    if(b){ ax=(b[0]+b[2])*W+14; ay=b[1]*H; }
    else { ax=c.at[0]*W; ay=c.at[1]*H; }
    const kk=grow(t,c.t_in,0.12);
    const bw=(w+16)*kk, bh=22*kk;
    push(mk("rect",{class:"s "+cls,x:ax,y:ay,width:bw,height:bh,opacity:.55}));
    if(kk>=1){
      // the loose box and the plate share the corner the line arrives at
      if(b) push(mk("line",{class:"s "+cls,opacity:.5,
        x1:(b[0]+b[2])*W,y1:(b[1]+b[3]/2)*H,x2:ax,y2:ay}));
      tab(g,ax,ay,typed(c.label,t,c.t_in+0.10,110),cls,"tl",W,H);
      if(c.unsupportable)
        push(mk("text",{class:"alarm",x:ax,y:ay+bh+2,"font-size":8},"UNSUPPORTED"));
    }
    return 1;
  }
  case "status_block": {
    const lines=c.lines||[];
    const n=Math.min(lines.length,Math.floor((t-c.t_in)*2.2));
    for(let i=0;i<n;i++)
      push(mk("text",{class:"status "+cls,x:8,y:H-12-(n-1-i)*12},lines[i]));
    return 1;
  }
  case "gaze_ray": {
    if(!b) break;
    const d=rec.direction,L=Math.hypot(d[0],d[1])||1;
    push(mk("line",{class:"s "+cls,x1:cx,y1:cy,
      x2:cx+d[0]/L*W*0.46*k,y2:cy+d[1]/L*W*0.46*k,opacity:.7}));
    return 1;
  }
  case "convergence": {
    const px=c.at[0]*W,py=c.at[1]*H;
    const kk=grow(t,c.t_in,0.26);
    [9,19,29].forEach((r,i)=>{ if(kk>i/3)
      push(mk("circle",{class:"s "+cls,cx:px,cy:py,r:r*Math.min(1,kk*3-i)})); });
    if(kk>=1){
      push(mk("path",{class:"s "+cls,d:`M${px-38} ${py}h76M${px} ${py-38}v76`}));
      const l1=typed(c.label,t,c.t_in+0.26,110);
      push(mk("text",{class:cls,x:px+42,y:py-14},l1));
      if(c.label2&&l1.length>=(c.label||"").length)
        push(mk("text",{class:cls,x:px+42,y:py-1,opacity:.62},
          typed(c.label2,t,c.t_in+0.26+c.label.length/110,110)));
    }
    return 1;
  }
  case "ghost": {
    if(!b) break;
    const x0=b[0]*W,y0=b[1]*H;
    const gw=b[2]*W, gh=b[3]*H;
    push(mk("rect",{class:"s doubt",x:x0,y:y0,width:gw,height:gh,opacity:.75}));
    if(c.hatch){ let d="";
      for(let o=-gh;o<gw;o+=7) d+=`M${x0+Math.max(0,o)} ${y0+Math.max(0,-o)}`+
        `L${x0+Math.min(gw,o+gh)} ${y0+Math.min(gh,gw-o)}`;
      push(mk("path",{class:"s doubt",d,opacity:.28})); }
    push(mk("text",{class:"doubt",x:x0,y:y0+gh+3,opacity:.8},c.state.toUpperCase()));
    return 1;
  }
  case "disagreement": {
    const p1=rec.blazeface_centre,p2=rec.yunet_centre;
    push(mk("line",{class:"s doubt",x1:p1[0]*W,y1:p1[1]*H,
      x2:p2[0]*W,y2:p2[1]*H}));
    push(mk("circle",{class:"s doubt",cx:p1[0]*W,cy:p1[1]*H,r:3}));
    push(mk("rect",{class:"s doubt",x:p2[0]*W-3,y:p2[1]*H-3,width:6,height:6}));
    push(mk("text",{class:"doubt",x:p2[0]*W+7,y:p2[1]*H+5},
      typed(c.label,t,c.t_in,110)));
    return 1;
  }
  case "orphan": {
    const fls=sourceDoc(score.panel,"flames");
    const blob=fls.blobs.find(x=>x.blob_id===c.blob_ids[0]); if(!blob) break;
    const bx=blob.centroid[0]*W,by=blob.centroid[1]*H;
    const kk=grow(t,c.t_in,0.22);
    push(mk("circle",{class:"s doubt",cx:bx,cy:by,r:8+10*kk}));
    if(b) push(mk("line",{class:"s doubt","stroke-dasharray":"5 5",
      x1:bx,y1:by,x2:bx+(cx-bx)*kk,y2:by+(cy-by)*kk}));
    if(kk>=1){
      const l1=typed(c.label,t,c.t_in+0.2,110);
      push(mk("text",{class:"doubt",x:bx+22,y:by-16},l1));
      if(c.label2&&l1.length>=(c.label||"").length)
        push(mk("text",{class:"doubt",x:bx+22,y:by-3,opacity:.62},
          typed(c.label2,t,c.t_in+0.2+c.label.length/110,110)));
    }
    return 1;
  }
  case "floor": case "tally": {
    const y=c.cue==="floor"?H-34:H-12;
    push(mk("line",{class:"s doubt",x1:6,y1:y-6,
      x2:6+(W-12)*grow(t,c.t_in,0.30),y2:y-6,opacity:.5}));
    push(mk("text",{class:"doubt",x:6,y:y-2},typed(c.label,t,c.t_in,110)));
    const l1=typed(c.label,t,c.t_in,110);
    if(c.label2&&l1.length>=c.label.length)
      push(mk("text",{class:"doubt",x:6,y:y+11,opacity:.62},
        typed(c.label2,t,c.t_in+c.label.length/110,110)));
    return 1;
  }
  }
  return 0;
}

/* ---------- text ----------
   The answer is typed as one continuous stream with a per-character blur
   resolve, and the column scrolls to keep the caret in view. Position and
   reveal are both pure functions of the clock, so a seek lands mid-word
   correctly and the loop cannot drift.

   The stream is built once as character spans. Per frame only the handful of
   characters still resolving are touched, so typing 14,000 characters costs
   the same as typing ten. */
function buildColumn(z,score){
  const st=score.answer_stream, el=z.answerEl;
  const sess=(score.source_state||{}).sessions||[];
  const head = st ? `PANEL ${z.panel} · ${sess.join(" · ")}`
                  : `PANEL ${z.panel} · ANSWER TRACK EMPTY · AWAITING TRANSCRIPTS`;
  el.innerHTML=`<div class="banner">${head}</div>`+
    `<div class="viewport"><div class="column"></div><div class="caret"></div></div>`;
  z.viewport=el.querySelector(".viewport");
  z.column=el.querySelector(".column");
  z.caretEl=el.querySelector(".caret");
  z.chars=[]; z.settled=0; z.lastIdx=-1;
  z.builtFor = st ? st.text.length : 0;
  if(!st) return;

  const text=st.text;
  let node=null, i=0;
  for(const seg of st.segments){
    const cls = seg.kind==="section" ? "sec"
      : [seg.evidence==="supplied"?"supplied":"",
         seg.unsupportable?"unsupported":""].filter(Boolean).join(" ");
    node=document.createElement(seg.kind==="section"?"div":"p");
    node.className=cls;
    // characters before this segment (the newlines between them) still need spans
    while(i<seg.start){ z.chars.push(null); i++; }
    for(;i<seg.end;i++){
      const sp=document.createElement("span");
      sp.textContent=text[i];
      sp.style.visibility="hidden";
      node.appendChild(sp);
      z.chars.push(sp);
    }
    z.column.appendChild(node);
  }
  while(z.chars.length<text.length) z.chars.push(null);
}

function drawText(z){
  const score=D["score_"+z.panel.toLowerCase()]; if(!score) return;
  const st=score.answer_stream;
  const want = st ? st.text.length : 0;
  if(z.builtFor!==want) buildColumn(z,score);
  if(!st||!z.chars) return;

  const on=st.char_onsets_ms, n=on.length;
  const ms=((clockSeconds(score.panel)*1000)%st.cycle_ms+st.cycle_ms)%st.cycle_ms;

  // binary search: the last character whose onset has passed
  let lo=0, hi=n-1, idx=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1;
    if(on[mid]<=ms){ idx=mid; lo=mid+1; } else hi=mid-1; }

  const BL=st.blur_resolve_ms||110;
  const win=Math.max(4,Math.ceil(BL/14)+2);

  if(idx<z.lastIdx){                       // cycle restarted
    for(let i=0;i<=z.lastIdx&&i<n;i++){ const sp=z.chars[i];
      if(sp){ sp.style.cssText="visibility:hidden"; } }
    z.settled=0;
  }
  for(let i=z.settled;i<=idx-win&&i<n;i++){
    const sp=z.chars[i]; if(sp) sp.style.cssText="";
    z.settled=i+1;
  }
  for(let i=Math.max(0,idx-win);i<=idx&&i<n;i++){
    const sp=z.chars[i]; if(!sp) continue;
    const age=ms-on[i];
    if(age<0){ sp.style.cssText="visibility:hidden"; continue; }
    const k=Math.min(1,age/BL);
    sp.style.cssText = k>=1 ? ""
      : `filter:blur(${(6*(1-k)).toFixed(2)}px);opacity:${(0.35+0.65*k).toFixed(3)}`;
  }
  z.lastIdx=idx;

  // the column follows the caret, so the newest line sits at a constant height
  let anchor=null;
  for(let i=idx;i>=0&&i>idx-400;i--){ if(z.chars[i]){ anchor=z.chars[i]; break; } }
  const vh=z.viewport.clientHeight, ch=z.column.scrollHeight;
  if(anchor){
    const top=anchor.offsetTop, lh=anchor.offsetHeight||30;
    let y=vh*0.68-top;
    y=Math.min(0,Math.max(y,vh-ch));
    z.column.style.transform=`translateY(${y.toFixed(1)}px)`;
    z.caretEl.style.cssText=
      `left:${(anchor.offsetLeft+anchor.offsetWidth).toFixed(1)}px;`+
      `top:${(top+y).toFixed(1)}px;height:${lh}px;display:block`;
  } else {
    z.column.style.transform="translateY(0px)";
    z.caretEl.style.display="none";
  }
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* ---------- loop ---------- */
function currentPass(score,t){
  let cur="—";
  for(const p of (score.passes||[])) if(t>=p.t_in&&t<p.t_out) cur=p.name;
  return cur;
}
function frame(){
  let marks=0;
  for(const z of ZONES){ if(z.kind==="overlay") marks+=drawOverlay(z)||0; else drawText(z); }
  const sa=D.score_a;
  if(sa){ const t=loopT(sa);
    document.getElementById("status").textContent=
      `${currentPass(sa,cycleT(sa))}   cycle ${cycleT(sa).toFixed(1)}/${sa.overlay_cycle_s||"-"}s   `+
      `loop ${t.toFixed(0)}/${Math.round(sa.loop_duration_s)}s   marks ${marks}   `+
      `${audioState()}   `+
      `${showBackdrop?"backdrop":"no backdrop"}${showGrid?"  GRID":""}   `+
      `[c] config  [p] backdrop  [g] target  [f] fields`; }
  requestAnimationFrame(frame);
}

/* ---------- keys ---------- */
function hud(){ document.getElementById("hud").textContent=
`CONFIG MODE
  drag the four handles per zone to keystone onto the painting
  c  leave config     p  painting backdrop (preview only — off in the gallery)
  g  alignment target — border, corner crosshairs, centre cross, tenths grid
  f  field layers — iso-luminance contours, gradient flow, mesh wireframe
  e  export alignment    i  import alignment    r  reset zones`; }
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="c"){ document.body.classList.toggle("config"); hud(); }
  else if(k==="p"){ showBackdrop=!showBackdrop; }
  else if(k==="g"){ showGrid=!showGrid; }
  else if(k==="f"){ showFields=!showFields; }
  else if(!document.body.classList.contains("config")) return;
  else if(k==="e"){ const o={}; ZONES.forEach(z=>o[z.id]=z.corners);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));
    a.download="mimesis-alignment.json"; a.click(); }
  else if(k==="i"){ const inp=document.createElement("input"); inp.type="file";
    inp.accept=".json"; inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
      const fr=new FileReader(); fr.onload=()=>{ try{ const o=JSON.parse(fr.result);
        ZONES.forEach(z=>{ if(o[z.id]) z.corners=o[z.id]; applyZone(z); }); saveZones();
      }catch(err){ alert("bad alignment file: "+err.message); } };
      fr.readAsText(f); }; inp.click(); }
  else if(k==="r"){ ZONES.forEach(z=>{z.corners=defaultCorners(z);applyZone(z);}); saveZones(); }
});
addEventListener("resize",()=>ZONES.forEach(applyZone));

/* ---------- boot ---------- */
async function boot(){
  if(!window.MIMESIS_DATA){
    try{ await Promise.all(FILES.map(async n=>{ const r=await fetch("data/"+n+".json");
      if(r.ok) D[n]=await r.json(); })); }
    catch(e){ document.getElementById("status").textContent=
      "could not load data/ — serve over http, or open the standalone build"; }
  }
  loadZones(); buildZones(); hud();
  setupAudio();
  frame();
}
boot();
</script>
